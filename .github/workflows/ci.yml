name: CI
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DB_URL: jdbc:mysql://127.0.0.1:3306/inteliagent
      DB_USER: root
      DB_PASSWORD: ''
      JWT_SECRET: ''
      CORS_ORIGINS: http://localhost:5173
    steps:
      - name: Start isolated case-compatible MySQL
        run: |
          docker run -d --name ci-mysql -p 3306:3306 -e MYSQL_ALLOW_EMPTY_PASSWORD=yes -e MYSQL_DATABASE=inteliagent mysql:8.4 --lower-case-table-names=1
          for attempt in $(seq 1 90); do
            if docker exec ci-mysql mysql -uroot -e 'SELECT 1' >/dev/null 2>&1; then exit 0; fi
            sleep 2
          done
          docker logs ci-mysql
          exit 1
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Generate ephemeral test key
        run: echo "JWT_SECRET=$(openssl rand -base64 48 | tr -d '\n')" >> "$GITHUB_ENV"
      - run: mvn -B verify
      - uses: actions/upload-artifact@v4
        with:
          name: service-${{ github.sha }}
          path: target/*.jar
          retention-days: 14
