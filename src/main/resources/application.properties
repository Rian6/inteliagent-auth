spring.application.name=auth
server.port=${PORT:8080}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3307/inteliagent}
spring.datasource.username=${DB_USER:inteliagent}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.connection-timeout=5000
spring.jdbc.template.query-timeout=15
security.jwt.secret=${JWT_SECRET}
security.jwt.issuer=inteliagent-auth
security.session.cookie-secure=${AUTH_COOKIE_SECURE:false}
security.cors.origins=${CORS_ORIGINS:http://localhost:5173}
server.error.include-message=never
server.error.include-stacktrace=never
server.tomcat.max-http-form-post-size=2MB
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:1025}
spring.mail.username=${SMTP_USER:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_TLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
mail.from=${MAIL_FROM:noreply@inteliagent.local}
server.compression.enabled=true
server.compression.mime-types=application/json,text/plain
server.compression.min-response-size=2048
